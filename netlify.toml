# Netlify settings for cangrassfarm.com (the site lives in cangrassfarm/).
[build]
  base = "cangrassfarm"
  command = "npm run build"
  publish = "dist"
  # Skip deploys when nothing in cangrassfarm/ changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.environment]
  NODE_VERSION = "22"

# Built JS/CSS file names change on every build, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
