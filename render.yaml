services:
  - type: web
    name: french-app-server
    runtime: node
    plan: free
    rootDir: french-learning-app/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: ALLOWED_ORIGINS
        value: "*"
