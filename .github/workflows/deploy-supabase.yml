name: Deploy Supabase (ebook backend)

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: sdfkcsurcgxnslhytznn
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  HAS_STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Deploy edge functions
        run: |
          for fn in create-checkout stripe-webhook get-order download; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

      - name: Sync edge function secrets
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
            SITE_URL="https://moazkhanbooks.com"
        if: ${{ env.HAS_STRIPE_KEY == 'true' }}
